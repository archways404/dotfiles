// ==================================================
// SCRIPTS / VIEWMODEL / EXTRAS
// ==================================================

alias "viewmodel_test" "viewmodel_fov 68; viewmodel_presetpos 0; viewmodel_offset_x 2.5; viewmodel_offset_y 0.75; viewmodel_offset_z -1.65; alias toggle_viewmodel viewmodel_current; echo Viewmodel: TEST"

alias "viewmodel_donk" "viewmodel_presetpos 0; viewmodel_fov 68; viewmodel_offset_x 2.5; viewmodel_offset_y -1; viewmodel_offset_z -1.8; alias toggle_viewmodel viewmodel_test; echo Viewmodel: DONK"

alias "viewmodel_current" "viewmodel_fov 68; viewmodel_presetpos 0; viewmodel_offset_x 2.5; viewmodel_offset_y 0.25; viewmodel_offset_z -2.0; alias toggle_viewmodel viewmodel_main; echo Viewmodel: CURRENT"

alias "viewmodel_main" "viewmodel_fov 68; viewmodel_presetpos 0; viewmodel_offset_x 2.5; viewmodel_offset_y -2; viewmodel_offset_z -2; alias toggle_viewmodel viewmodel_compact; echo Viewmodel: CLOSE AF"

alias "viewmodel_compact" "viewmodel_fov 68; viewmodel_presetpos 0; viewmodel_offset_x 2.5; viewmodel_offset_y 2.0; viewmodel_offset_z -2.0; alias toggle_viewmodel viewmodel_classic; echo Viewmodel: COMPACT (MAX UNZOOM)"

alias "viewmodel_classic" "viewmodel_fov 68; viewmodel_presetpos 0; viewmodel_offset_x 2.0; viewmodel_offset_y -0.5; viewmodel_offset_z -2.0; alias toggle_viewmodel viewmodel_donk; echo Viewmodel: CLASSIC"

alias "toggle_viewmodel" "viewmodel_donk"

// Default
viewmodel_test


