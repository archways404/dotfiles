alias "load_viewmodel_lethal1" "viewmodel_fov 68; viewmodel_offset_x 2.5; viewmodel_offset_y -1;viewmodel_offset_z -1.35; viewmodel_presetpos 2; alias toggle_viewmodel load_viewmodel_testing; echo viewmodel: loaded"

alias "load_viewmodel_testing" "viewmodel_fov 68; viewmodel_offset_x 2.5; viewmodel_offset_y -2;viewmodel_offset_z -1.5; viewmodel_presetpos 2; alias toggle_viewmodel load_viewmodel_lethal1; echo viewmodel: testing loaded"


load_viewmodel_lethal1
