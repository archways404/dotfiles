// ==================================================
// DEFAULT LOAD
// ==================================================
xhair_white
LETHAL1_v1



// ==================================================
// CROSSHAIR
// ==================================================
alias "LETHAL1_v1" "xhair_shared; cl_crosshair_drawoutline 0; cl_crosshairdot 0; cl_crosshair_gap 2; cl_crosshair_length 3; cl_crosshair_thickness 1; alias toggle_crosshair crosshair_primary; echo xhair applied: LETHAL1_v1"



// ==================================================
// COLOR
// ==================================================
alias "xhair_white" "cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255;"



// ==================================================
// SHARED CROSSHAIR SETTINGS
// ==================================================
alias "xhair_shared" "cl_crosshaircolor_a 255; cl_crosshairstyle 4; cl_crosshair_t 0; cl_crosshair_recoil 0; cl_crosshair_dynamic_splitdist 0; cl_crosshair_dynamic_splitalpha_innermod 0; cl_crosshair_dynamic_splitalpha_outermod 1; cl_crosshair_dynamic_maxdist_splitratio 0.5"
