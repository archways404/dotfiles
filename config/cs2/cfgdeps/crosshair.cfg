// ==================================================
// SHARED CROSSHAIR SETTINGS
// ==================================================
alias "xhair_shared" "cl_crosshaircolor_a 255; cl_crosshairstyle 4; cl_crosshair_t 0; cl_crosshair_recoil 0; cl_crosshair_dynamic_splitdist 0; cl_crosshair_dynamic_splitalpha_innermod 0; cl_crosshair_dynamic_splitalpha_outermod 1; cl_crosshair_dynamic_maxdist_splitratio 0.5"

// ==================================================
// V3 COMPONENTS
// ==================================================
alias "xhair_v3_dynamic" "cl_crosshair_dynamic_maxdist_splitratio 0.3; cl_crosshair_dynamic_splitalpha_innermod 1; cl_crosshair_dynamic_splitalpha_outermod 0.45; cl_crosshair_dynamic_splitdist 7; cl_crosshair_dynamic_spread_limit 242"

alias "xhair_v3_shape" "cl_crosshair_drawoutline 1; cl_crosshair_gap 0; cl_crosshair_length 2; cl_crosshair_thickness 1; cl_crosshairdot 0; cl_crosshair_screen_height 1024"

alias "xhair_v3_outline" "cl_crosshairoutline_a 255; cl_crosshairoutline_b 0; cl_crosshairoutline_g 0; cl_crosshairoutline_r 0"

alias "xhair_v3_scope" "cl_ironsight_dot_scale 1; cl_ironsight_usecrosshaircolor 0"

// ==================================================
// CROSSHAIRS
// Cycle: v1 -> v2 -> v3 -> v1
// ==================================================
alias "load_LETHAL1_v1" "xhair_shared; cl_crosshair_drawoutline 0; cl_crosshairdot 0; cl_crosshair_gap 2; cl_crosshair_length 3; cl_crosshair_thickness 1; alias load_crosshair load_LETHAL1_v2; echo crosshair applied: LETHAL1_v1"

alias "load_LETHAL1_v2" "xhair_shared; cl_crosshair_drawoutline 0; cl_crosshairdot 1; cl_crosshair_gap 2; cl_crosshair_length 2; cl_crosshair_thickness 1; alias load_crosshair load_LETHAL1_v3; echo crosshair applied: LETHAL1_v2"

alias "load_LETHAL1_v3" "xhair_shared; xhair_v3_dynamic; xhair_v3_shape; xhair_v3_outline; xhair_v3_scope; alias load_crosshair load_LETHAL1_v1; echo crosshair applied: LETHAL1_v3"

// ==================================================
// COLORS
// ==================================================
alias "load_green" "cl_crosshaircolor_r 0; cl_crosshaircolor_g 255; cl_crosshaircolor_b 0; alias load_color load_white; echo color: green"

alias "load_white" "cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255; alias load_color load_black; echo color: white"

alias "load_black" "cl_crosshaircolor_r 0; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; alias load_color load_yellow; echo color: black"

alias "load_yellow" "cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 0; alias load_color load_red; echo color: yellow"

alias "load_red" "cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; alias load_color load_cyan; echo color: red"

alias "load_cyan" "cl_crosshaircolor_r 0; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255; alias load_color load_green; echo color: cyan"

// ==================================================
// TOGGLE INITIALIZATION AND BINDS
// ==================================================
alias "load_crosshair" "load_LETHAL1_v3"
alias "load_color" "load_green"

bind "[" "load_color"
bind "]" "load_crosshair"

// ==================================================
// DEFAULT LOAD
// ==================================================
load_LETHAL1_v3
load_green